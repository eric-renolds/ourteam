<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Troy - Internal Operations Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);
  padding:20px;
}
.login-card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;
  padding:48px 40px;
  width:100%;
  max-width:420px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,0.4);
}
.logo{
  width:64px;height:64px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;
  font-size:28px;font-weight:800;color:#fff;
  box-shadow:0 8px 24px rgba(99,102,241,0.4);
}
h1{
  color:#fff;font-size:28px;font-weight:700;
  letter-spacing:1px;margin-bottom:4px;
}
.subtitle{
  color:rgba(255,255,255,0.5);font-size:14px;
  margin-bottom:32px;
}
.tabs{
  display:flex;gap:4px;
  background:rgba(255,255,255,0.06);
  border-radius:12px;padding:4px;
  margin-bottom:28px;
}
.tab{
  flex:1;padding:10px 8px;
  border:none;border-radius:10px;
  background:transparent;
  color:rgba(255,255,255,0.4);
  font-size:13px;font-weight:600;
  cursor:pointer;transition:all 0.3s;
}
.tab.active{
  background:rgba(99,102,241,0.9);
  color:#fff;
  box-shadow:0 4px 12px rgba(99,102,241,0.3);
}
.tab:hover:not(.active){color:rgba(255,255,255,0.7)}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{
  display:block;color:rgba(255,255,255,0.6);
  font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.5px;
  margin-bottom:6px;
}
input{
  width:100%;padding:14px 16px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  color:#fff;font-size:15px;
  transition:all 0.3s;
  outline:none;
}
input::placeholder{color:rgba(255,255,255,0.25)}
input:focus{
  border-color:rgba(99,102,241,0.6);
  background:rgba(255,255,255,0.1);
  box-shadow:0 0 0 3px rgba(99,102,241,0.15);
}
.btn{
  width:100%;padding:14px;
  border:none;border-radius:12px;
  font-size:15px;font-weight:600;
  cursor:pointer;transition:all 0.3s;
  margin-top:8px;
}
.btn-primary{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;
  box-shadow:0 4px 16px rgba(99,102,241,0.3);
}
.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 24px rgba(99,102,241,0.4);
}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:0.5;pointer-events:none}
#msg{
  margin-top:20px;padding:12px 16px;
  border-radius:10px;font-size:14px;
  display:none;
}
#msg.success{
  display:block;
  background:rgba(34,197,94,0.15);
  border:1px solid rgba(34,197,94,0.3);
  color:#4ade80;
}
#msg.error{
  display:block;
  background:rgba(239,68,68,0.15);
  border:1px solid rgba(239,68,68,0.3);
  color:#f87171;
}
#msg.info{
  display:block;
  background:rgba(99,102,241,0.15);
  border:1px solid rgba(99,102,241,0.3);
  color:#a5b4fc;
}
.hint{
  color:rgba(255,255,255,0.35);
  font-size:12px;margin-top:20px;
}
@media(max-width:480px){
  .login-card{padding:32px 24px}
  h1{font-size:24px}
}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">T</div>
  <h1>TEAM TROY</h1>
  <p class="subtitle">Internal Operations Portal</p>

  <div class="tabs">
    <button class="tab active" id="tab-request" onclick="switchTab('request')">Request Access</button>
    <button class="tab" id="tab-login" onclick="switchTab('login')">Login</button>
  </div>

  <!-- Request Access Form -->
  <div id="request-form">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="req-email" placeholder="you@company.com">
    </div>
    <div class="form-group">
      <label>Choose a Password</label>
      <input type="password" id="req-password" placeholder="Min 6 characters">
    </div>
    <button class="btn btn-primary" id="req-btn" onclick="requestAccess()">Request Access</button>
    <p class="hint">Your request will be sent to the admin for approval</p>
  </div>

  <!-- Login Form -->
  <div id="login-form" style="display:none">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="login-email" placeholder="you@company.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Your password">
    </div>
    <button class="btn btn-primary" id="login-btn" onclick="login()">Login</button>
    <p class="hint">Only approved members can login</p>
  </div>

  <div id="msg"></div>
</div>

<script>
function switchTab(tab){
  document.getElementById('tab-request').classList.toggle('active', tab==='request');
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('request-form').style.display = tab==='request' ? '' : 'none';
  document.getElementById('login-form').style.display = tab==='login' ? '' : 'none';
  clearMsg();
}

function showMsg(text, type){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = type;
  m.style.display = 'block';
}
function clearMsg(){
  const m = document.getElementById('msg');
  m.textContent = '';
  m.className = '';
  m.style.display = 'none';
}

async function requestAccess(){
  const email = document.getElementById('req-email').value.trim();
  const password = document.getElementById('req-password').value;

  if(!email || !password){
    showMsg('Please enter both email and password', 'error');
    return;
  }
  if(password.length < 6){
    showMsg('Password must be at least 6 characters', 'error');
    return;
  }

  document.getElementById('req-btn').disabled = true;
  document.getElementById('req-btn').textContent = 'Submitting...';

  try {
    // Step 1: Create Supabase auth account
    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
      email,
      password
    });

    if(signUpError){
      if(signUpError.message.includes('already registered')){
        showMsg('This email has already been registered. Try logging in.', 'info');
      } else {
        showMsg(signUpError.message, 'error');
      }
      return;
    }

    // Step 2: Insert into eric table with approved=false
    const { error: insertError } = await supabaseClient
      .from('eric')
      .insert({ email: email, approved: false, role: 'user' });

    if(insertError){
      console.log('Insert error:', insertError);
      // If duplicate, that's fine — they already requested
      if(insertError.code === '23505'){
        showMsg('You already have a pending request. Please wait for admin approval.', 'info');
      } else {
        showMsg('Request submitted! Wait for admin approval.', 'success');
      }
      return;
    }

    // Sign out so they don't stay logged in before approval
    await supabaseClient.auth.signOut();

    showMsg('Request submitted! The admin will review your access. You can login after approval.', 'success');
    document.getElementById('req-email').value = '';
    document.getElementById('req-password').value = '';

  } catch(err){
    showMsg('Something went wrong. Please try again.', 'error');
    console.log('Request error:', err);
  } finally {
    document.getElementById('req-btn').disabled = false;
    document.getElementById('req-btn').textContent = 'Request Access';
  }
}

async function login(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  if(!email || !password){
    showMsg('Please enter both email and password', 'error');
    return;
  }

  document.getElementById('login-btn').disabled = true;
  document.getElementById('login-btn').textContent = 'Logging in...';

  try {
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if(error){
      showMsg('Invalid email or password', 'error');
      return;
    }

    // Check approval in eric table
    const { data } = await supabaseClient
      .from('eric')
      .select('approved, role')
      .eq('email', email)
      .single();

    if(!data){
      showMsg('Account not found. Please request access first.', 'error');
      await supabaseClient.auth.signOut();
      return;
    }

    if(!data.approved){
      showMsg('Your access is still pending admin approval.', 'info');
      await supabaseClient.auth.signOut();
      return;
    }

    // Approved — go to portal
    window.location.href = 'portal.html';

  } catch(err){
    showMsg('Something went wrong. Please try again.', 'error');
  } finally {
    document.getElementById('login-btn').disabled = false;
    document.getElementById('login-btn').textContent = 'Login';
  }
}

// If already logged in and approved, redirect
(async () => {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if(user){
    const { data } = await supabaseClient
      .from('eric')
      .select('approved')
      .eq('email', user.email)
      .single();
    if(data && data.approved){
      window.location.href = 'portal.html';
    }
  }
})();
</script>

</body>
</html>
