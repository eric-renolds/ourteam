<!DOCTYPE html>
<html>
<head>

<title>Team Troy Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

body{
font-family:Arial;
background:#f5f7fb;
display:flex;
height:100vh;
align-items:center;
justify-content:center;
}

.card{
background:white;
padding:40px;
border-radius:20px;
width:350px;
box-shadow:0 10px 30px #ddd;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
background:#111827;
color:white;
border:0;
border-radius:10px;
cursor:pointer;
}

#message{
margin-top:15px;
color:#555;
}

</style>

</head>


<body>


<div class="card">

<h1>TEAM TROY</h1>

<p>Internal Operations Portal</p>


<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">


<button onclick="login()">
Login
</button>


<div id="message"></div>


</div>



<script>


async function login(){


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



const {data,error} =
await supabaseClient.auth.signInWithPassword({

email,
password

});



if(error){

document.getElementById("message").innerHTML =
"Login failed";

return;

}



const {data:userData,error:userError} =
await supabaseClient
.from("eric")
.select("approved")
.eq("email",email)
.single();



if(userError){

document.getElementById("message").innerHTML =
"User not approved";

return;

}



if(userData.approved === true){

window.location.href="portal.html";

}

else{

document.getElementById("message").innerHTML =
"Waiting for owner approval";

}


}


</script>


</body>
</html>
