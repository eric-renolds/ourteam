<!DOCTYPE html>
<html>

<head>

<title>Team Troy Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:40px;
}

.card{

background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 10px 25px #ddd;

}

button{

background:#111827;
color:white;
border:none;
padding:10px 18px;
border-radius:10px;
cursor:pointer;

}

h1{
text-align:center;
}

</style>

</head>


<body>


<h1>TEAM TROY ADMIN</h1>

<div id="users"></div>



<script>


async function checkAdmin(){


const {data:{user}} =
await supabaseClient.auth.getUser();


if(!user){

window.location.href="index.html";

return;

}



const {data:admin} =
await supabaseClient
.from("eric")
.select("role")
.eq("email",user.email)
.single();



if(!admin || admin.role !== "admin"){

document.body.innerHTML =
"Access denied";

return;

}


loadUsers();


}



async function loadUsers(){


const {data,error}=await supabaseClient
.from("eric")
.select("*")
.eq("approved",false);



let html="";


data.forEach(user=>{


html += `

<div class="card">

<h3>${user.email}</h3>

<p>Status: Waiting</p>

<button onclick="approve('${user.email}')">
Approve
</button>

</div>

`;


});


document.getElementById("users").innerHTML=html;


}



async function approve(email){


await supabaseClient
.from("eric")
.update({
approved:true
})
.eq("email",email);


alert("User approved");


loadUsers();


}



checkAdmin();


</script>


</body>

</html>
