<!DOCTYPE html>
<html>

<head>

<title>Team Troy Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:40px;
}


.card{

background:white;
padding:25px;
border-radius:20px;
margin:20px;

}


button{

background:#111827;
color:white;
padding:10px;
border:0;
border-radius:10px;

}

</style>

</head>


<body>


<h1>TEAM TROY ADMIN</h1>

<div id="list"></div>



<script>


async function load(){


const {data:{user}}=
await supabaseClient.auth.getUser();


const {data:admin}=await supabaseClient
.from("eric")
.select("role")
.eq("email",user.email)
.single();



if(!admin || admin.role!="admin"){

document.body.innerHTML="Access Denied";

return;

}



const {data}=await supabaseClient
.from("eric")
.select("*")
.eq("approved",false);



let html="";


data.forEach(u=>{


html+=`

<div class="card">

<h3>${u.email}</h3>

<p>Pending approval</p>

<button onclick="approve('${u.email}')">
Approve
</button>

</div>

`;


});


document.getElementById("list").innerHTML=html;


}




async function approve(email){


await supabaseClient
.from("eric")
.update({

approved:true

})
.eq("email",email);


alert("Approved");


load();


}


load();


</script>


</body>

</html>
