<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Troy - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#0f172a;color:#e2e8f0;
  min-height:100vh;
}

/* Header */
.header{
  background:linear-gradient(135deg,#1e293b,#0f172a);
  border-bottom:1px solid rgba(255,255,255,0.06);
  padding:0 24px;
  position:sticky;top:0;z-index:100;
}
.header-inner{
  max-width:1000px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  height:64px;
}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{
  width:36px;height:36px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:#fff;
}
.header-title{font-size:18px;font-weight:700;color:#fff;letter-spacing:0.5px}
.header-badge{
  background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.3);
  color:#fbbf24;padding:4px 10px;border-radius:6px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
}
.header-right{display:flex;align-items:center;gap:12px}
.btn-back{
  padding:8px 16px;border-radius:8px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.6);font-size:13px;font-weight:600;
  cursor:pointer;text-decoration:none;transition:all 0.2s;
}
.btn-back:hover{background:rgba(255,255,255,0.1);color:#fff}

/* Stats */
.stats{
  max-width:1000px;margin:24px auto 0;padding:0 24px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
}
.stat-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:14px;padding:20px;text-align:center;
}
.stat-num{font-size:32px;font-weight:800;color:#fff}
.stat-label{
  font-size:12px;font-weight:600;
  color:rgba(255,255,255,0.4);
  text-transform:uppercase;letter-spacing:0.5px;
  margin-top:4px;
}
.stat-card.pending .stat-num{color:#fbbf24}
.stat-card.approved .stat-num{color:#4ade80}
.stat-card.total .stat-num{color:#a5b4fc}

/* Container */
.container{
  max-width:1000px;margin:0 auto;padding:24px;
}
.section-title{
  font-size:13px;font-weight:700;
  color:rgba(255,255,255,0.3);
  text-transform:uppercase;letter-spacing:1px;
  margin:28px 0 14px;display:flex;align-items:center;gap:8px;
}
.count-badge{
  background:rgba(255,255,255,0.08);
  padding:2px 8px;border-radius:10px;
  font-size:12px;color:rgba(255,255,255,0.5);
}

/* User Card */
.user-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:14px;padding:18px 20px;
  margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;
  transition:all 0.2s;
}
.user-card:hover{
  background:rgba(255,255,255,0.06);
  border-color:rgba(255,255,255,0.1);
}
.user-info{display:flex;align-items:center;gap:14px}
.user-avatar{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#fff;
  flex-shrink:0;
}
.user-avatar.pending{background:rgba(251,191,36,0.2)}
.user-avatar.active{background:rgba(34,197,94,0.2)}
.user-email{font-size:15px;font-weight:600;color:#fff}
.user-meta{
  font-size:12px;color:rgba(255,255,255,0.35);margin-top:2px;
}
.user-actions{display:flex;gap:8px}

.btn{
  padding:8px 18px;border-radius:8px;
  border:none;font-size:13px;font-weight:600;
  cursor:pointer;transition:all 0.2s;
}
.btn-approve{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#fff;box-shadow:0 2px 8px rgba(34,197,94,0.3);
}
.btn-approve:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(34,197,94,0.4)}
.btn-reject{
  background:rgba(239,68,68,0.15);
  border:1px solid rgba(239,68,68,0.3);
  color:#f87171;
}
.btn-reject:hover{background:rgba(239,68,68,0.25)}
.btn-remove{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.5);
}
.btn-remove:hover{background:rgba(239,68,68,0.15);color:#f87171;border-color:rgba(239,68,68,0.3)}

.status-badge{
  padding:4px 10px;border-radius:6px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
}
.status-badge.approved{
  background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:#4ade80;
}
.status-badge.admin-badge{
  background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);color:#a5b4fc;
}

.empty-state{
  text-align:center;padding:40px;
  color:rgba(255,255,255,0.3);font-size:14px;
}
.empty-icon{font-size:40px;margin-bottom:8px}

/* Access Denied */
.access-denied{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:80vh;text-align:center;padding:24px;
}
.access-denied-icon{font-size:64px;margin-bottom:16px}
.access-denied h2{color:#f87171;margin-bottom:8px}
.access-denied p{color:rgba(255,255,255,0.4);margin-bottom:24px}

/* Loading */
.loading-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:#0f172a;display:flex;align-items:center;
  justify-content:center;z-index:9999;transition:opacity 0.3s;
}
.loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{
  width:40px;height:40px;
  border:3px solid rgba(255,255,255,0.1);
  border-top-color:#6366f1;border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;
  padding:12px 24px;border-radius:12px;
  font-size:14px;font-weight:600;color:#fff;
  transform:translateY(80px);opacity:0;
  transition:all 0.3s;z-index:1000;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#22c55e;box-shadow:0 8px 24px rgba(34,197,94,0.3)}
.toast.error{background:#ef4444;box-shadow:0 8px 24px rgba(239,68,68,0.3)}

@media(max-width:640px){
  .stats{grid-template-columns:1fr}
  .user-card{flex-direction:column;align-items:flex-start;gap:12px}
  .user-actions{width:100%;justify-content:flex-end}
  .header-title{font-size:15px}
}
</style>
</head>
<body>

<div class="loading-overlay" id="loader">
  <div class="spinner"></div>
</div>

<div id="main-content" style="display:none">

<header class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-logo">T</div>
      <span class="header-title">TEAM TROY</span>
      <span class="header-badge">Admin</span>
    </div>
    <div class="header-right">
      <a href="portal.html" class="btn-back">Back to Portal</a>
    </div>
  </div>
</header>

<div class="stats" id="stats">
  <div class="stat-card pending">
    <div class="stat-num" id="stat-pending">0</div>
    <div class="stat-label">Pending</div>
  </div>
  <div class="stat-card approved">
    <div class="stat-num" id="stat-approved">0</div>
    <div class="stat-label">Approved</div>
  </div>
  <div class="stat-card total">
    <div class="stat-num" id="stat-total">0</div>
    <div class="stat-label">Total Users</div>
  </div>
</div>

<div class="container">
  <div id="pending-section">
    <div class="section-title">Pending Requests <span class="count-badge" id="pending-count">0</span></div>
    <div id="pending-list"></div>
  </div>

  <div id="approved-section">
    <div class="section-title">Approved Members <span class="count-badge" id="approved-count">0</span></div>
    <div id="approved-list"></div>
  </div>
</div>

</div>

<div id="denied-content" style="display:none">
  <div class="access-denied">
    <div class="access-denied-icon">&#x1f6ab;</div>
    <h2>Access Denied</h2>
    <p>Only admins can access this page.</p>
    <a href="portal.html" class="btn-back">Back to Portal</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
async function load(){
  const {data:{user}}=await supabaseClient.auth.getUser();
  if(!user){window.location.href='index.html';return}

  const {data:admin}=await supabaseClient
    .from('eric').select('role')
    .eq('email',user.email).single();

  if(!admin||admin.role!=='admin'){
    document.getElementById('loader').classList.add('hide');
    document.getElementById('denied-content').style.display='block';
    return;
  }

  // Load all users
  const {data:users}=await supabaseClient
    .from('eric').select('*').order('created_at',{ascending:false});

  const pending=users.filter(u=>!u.approved);
  const approved=users.filter(u=>u.approved);

  // Stats
  document.getElementById('stat-pending').textContent=pending.length;
  document.getElementById('stat-approved').textContent=approved.length;
  document.getElementById('stat-total').textContent=users.length;
  document.getElementById('pending-count').textContent=pending.length;
  document.getElementById('approved-count').textContent=approved.length;

  // Pending list
  if(pending.length===0){
    document.getElementById('pending-list').innerHTML=
      '<div class="empty-state"><div class="empty-icon">&#x2705;</div>No pending requests</div>';
  }else{
    document.getElementById('pending-list').innerHTML=pending.map(u=>`
      <div class="user-card" id="user-${CSS.escape(u.email)}">
        <div class="user-info">
          <div class="user-avatar pending">${u.email[0].toUpperCase()}</div>
          <div>
            <div class="user-email">${u.email}</div>
            <div class="user-meta">Requested ${timeAgo(u.created_at)}</div>
          </div>
        </div>
        <div class="user-actions">
          <button class="btn btn-approve" onclick="approve('${u.email}')">Approve</button>
          <button class="btn btn-reject" onclick="reject('${u.email}')">Reject</button>
        </div>
      </div>
    `).join('');
  }

  // Approved list
  if(approved.length===0){
    document.getElementById('approved-list').innerHTML=
      '<div class="empty-state"><div class="empty-icon">&#x1f465;</div>No approved members yet</div>';
  }else{
    document.getElementById('approved-list').innerHTML=approved.map(u=>`
      <div class="user-card">
        <div class="user-info">
          <div class="user-avatar active">${u.email[0].toUpperCase()}</div>
          <div>
            <div class="user-email">${u.email}</div>
            <div class="user-meta">${u.role==='admin'?'Administrator':'Member'} &middot; Joined ${timeAgo(u.created_at)}</div>
          </div>
        </div>
        <div class="user-actions">
          ${u.role==='admin'?
            '<span class="status-badge admin-badge">Admin</span>':
            `<span class="status-badge approved">Active</span>
             <button class="btn btn-remove" onclick="revoke('${u.email}')">Revoke</button>`
          }
        </div>
      </div>
    `).join('');
  }

  document.getElementById('main-content').style.display='block';
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),200);
}

async function approve(email){
  const {error}=await supabaseClient
    .from('eric').update({approved:true}).eq('email',email);
  if(error){showToast('Failed to approve','error');return}
  showToast('Approved: '+email,'success');
  load();
}

async function reject(email){
  if(!confirm('Remove access request from '+email+'?'))return;
  const {error}=await supabaseClient
    .from('eric').delete().eq('email',email);
  if(error){showToast('Failed to reject','error');return}
  showToast('Rejected: '+email,'success');
  load();
}

async function revoke(email){
  if(!confirm('Revoke access for '+email+'?'))return;
  const {error}=await supabaseClient
    .from('eric').update({approved:false}).eq('email',email);
  if(error){showToast('Failed to revoke','error');return}
  showToast('Access revoked: '+email,'success');
  load();
}

function timeAgo(dateStr){
  if(!dateStr)return '';
  const diff=Date.now()-new Date(dateStr).getTime();
  const mins=Math.floor(diff/60000);
  if(mins<1)return 'just now';
  if(mins<60)return mins+'m ago';
  const hrs=Math.floor(mins/60);
  if(hrs<24)return hrs+'h ago';
  const days=Math.floor(hrs/24);
  if(days<30)return days+'d ago';
  return new Date(dateStr).toLocaleDateString();
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),3000);
}

load();
</script>

</body>
</html>
